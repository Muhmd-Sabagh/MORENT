<div
  class="d-flex justify-content-center align-items-center min-vh-100 bg-light py-5"
>
  <div
    class="card border-0 shadow-sm p-4 p-md-5 bg-white"
    style="max-width: 600px; width: 100%; border-radius: 10px"
  >
    <div class="text-center mb-4">
      <h2 class="text-2xl font-bold text-primary mb-1">Join MORENT</h2>
      <p class="text-muted text-sm">Create an account to start renting.</p>
    </div>

    <ng-container *ngIf="errorMessage$ | async as errorMessage">
      <div *ngIf="errorMessage" class="alert alert-danger text-sm py-2">
        {{ errorMessage }}
      </div>
    </ng-container>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label font-semibold text-sm">First Name</label>
          <input
            type="text"
            class="form-control bg-light border-0 py-2"
            formControlName="firstName"
            placeholder="John"
          />
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label font-semibold text-sm">Last Name</label>
          <input
            type="text"
            class="form-control bg-light border-0 py-2"
            formControlName="lastName"
            placeholder="Doe"
          />
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label font-semibold text-sm">Email</label>
          <input
            type="email"
            class="form-control bg-light border-0 py-2"
            formControlName="email"
            placeholder="john@example.com"
          />
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label font-semibold text-sm">Phone Number</label>
          <input
            type="text"
            class="form-control bg-light border-0 py-2"
            formControlName="phoneNumber"
            placeholder="+1 234 567 890"
          />
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label font-semibold text-sm">Username</label>
        <input
          type="text"
          class="form-control bg-light border-0 py-2"
          formControlName="username"
          placeholder="johndoe123"
        />
      </div>

      <div class="mb-4">
        <label class="form-label font-semibold text-sm">Password</label>
        <input
          type="password"
          class="form-control bg-light border-0 py-2"
          formControlName="password"
          placeholder="••••••••"
        />
      </div>

      <app-button
        label="Create Account"
        variant="primary"
        size="medium"
        [fullWidth]="true"
        [disabled]="registerForm.invalid || ((isLoading$ | async) ?? false)"
      >
      </app-button>
    </form>

    <div class="text-center mt-4 text-sm">
      <span class="text-muted">Already have an account? </span>
      <a
        routerLink="/auth/login"
        class="text-primary font-semibold text-decoration-none"
        >Log in</a
      >
    </div>
  </div>
</div>
