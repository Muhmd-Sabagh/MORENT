<header class="bg-white border-bottom py-3 sticky-top z-3">
  <div class="container d-flex align-items-center justify-content-between">
    <!-- Logo & Search (Left side) -->
    <div class="d-flex align-items-center gap-4 w-100 me-4">
      <a
        routerLink="/"
        class="text-primary font-bold text-2xl text-decoration-none mb-0"
      >
        MORENT
      </a>

      <!-- Search Bar -->
      <div
        class="position-relative d-none d-md-block"
        style="max-width: 400px; width: 100%"
      >
        <i
          class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"
        ></i>
        <input
          type="text"
          class="form-control rounded-pill bg-light border-0 ps-5 py-2"
          placeholder="Search something here"
        />
        <i
          class="bi bi-sliders position-absolute top-50 end-0 translate-middle-y me-3 text-muted cursor-pointer"
        ></i>
      </div>
    </div>

    <!-- Actions (Right side) -->
    <div class="d-flex align-items-center gap-3">
      <ng-container *ngIf="currentUser$ | async as user; else loggedOut">
        <!-- Logged In State: Icons & Profile -->
        <button
          class="btn btn-light rounded-circle p-2 d-none d-sm-flex align-items-center justify-content-center text-muted border"
          style="width: 40px; height: 40px"
        >
          <i class="bi bi-heart-fill"></i>
        </button>
        <button
          class="btn btn-light rounded-circle p-2 d-none d-sm-flex align-items-center justify-content-center text-muted border position-relative"
          style="width: 40px; height: 40px"
        >
          <i class="bi bi-bell-fill"></i>
          <span
            class="position-absolute top-0 end-0 p-1 bg-danger border border-light rounded-circle"
          >
            <span class="visually-hidden">New alerts</span>
          </span>
        </button>

        <!-- Profile Dropdown -->
        <div class="dropdown">
          <button
            class="btn btn-link p-0 border-0 rounded-circle overflow-hidden shadow-sm"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            style="width: 44px; height: 44px"
          >
            <img
              src= "/assests/images/Profile_avatar_placeholder.png"
              alt="Profile"
              class="w-100 h-100 object-fit-cover bg-primary"
            />
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
            <li class="px-3 py-2 border-bottom">
              <span class="d-block font-semibold text-sm"
                >{{ user.firstName }} {{ user.lastName }}</span
              >
              <span class="d-block text-muted text-xs"
                >&#64;{{ user.username }}</span
              >
            </li>
            <li>
              <a
                class="dropdown-item text-sm py-2"
                routerLink="/rentals/my-rentals"
                ><i class="bi bi-car-front me-2"></i> My Rentals</a
              >
            </li>
            <li>
              <button
                class="dropdown-item text-sm text-danger py-2"
                (click)="onLogout()"
              >
                <i class="bi bi-box-arrow-right me-2"></i> Logout
              </button>
            </li>
          </ul>
        </div>
      </ng-container>

      <ng-template #loggedOut>
        <!-- Logged Out State: Login / Register Buttons -->
        <a
          routerLink="/auth/login"
          class="btn btn-outline-primary fw-semibold rounded-pill px-4"
          >Log in</a
        >
        <a
          routerLink="/auth/register"
          class="btn btn-primary fw-semibold rounded-pill px-4 d-none d-sm-inline-block"
          >Sign up</a
        >
      </ng-template>
    </div>
  </div>
</header>
