<div
  class="d-flex justify-content-center align-items-center min-vh-100 bg-light py-5"
>
  <div
    class="card border-0 shadow-sm p-4 p-md-5 bg-white"
    style="max-width: 450px; width: 100%; border-radius: 10px"
  >
    <div class="text-center mb-4">
      <h2 class="text-2xl font-bold text-primary mb-1">MORENT</h2>
      <p class="text-muted text-sm">Welcome back! Please enter your details.</p>
    </div>

    <ng-container *ngIf="errorMessage$ | async as errorMessage">
      <div *ngIf="errorMessage" class="alert alert-danger text-sm py-2">
        {{ errorMessage }}
      </div>
    </ng-container>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label font-semibold text-sm">Username</label>
        <input
          type="text"
          class="form-control bg-light border-0 py-2"
          formControlName="username"
          placeholder="Enter your username"
        />
      </div>

      <div class="mb-4">
        <label class="form-label font-semibold text-sm">Password</label>
        <input
          type="password"
          class="form-control bg-light border-0 py-2"
          formControlName="password"
          placeholder="••••••••"
        />
      </div>

      <app-button
        label="Log In"
        variant="primary"
        size="medium"
        [fullWidth]="true"
        [disabled]="loginForm.invalid || ((isLoading$ | async) ?? false)"
      >
      </app-button>
    </form>

    <div class="text-center mt-4 text-sm">
      <span class="text-muted">Don't have an account? </span>
      <a
        routerLink="/auth/register"
        class="text-primary font-semibold text-decoration-none"
        >Sign up</a
      >
    </div>
  </div>
</div>
